<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Vietnam Landmarks Gallery</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js" defer></script>
</head>
<body>
<header>
    <h1>Famous Landmarks of Vietnam</h1>
</header>
<main>
    <div id="image">Hover over an image below to display here.</div>
    <div class="gallery">
        <img class="preview" src="images/ha-long.png" alt="Hạ Long Bay, Quảng Ninh" tabindex="0" onmouseover="upDate(this)" onmouseleave="undo()" onfocus="upDate(this)" onblur="undo()">
        <img class="preview" src="images/hoian.png" alt="Hội An Ancient Town, Quảng Nam" tabindex="0" onmouseover="upDate(this)" onmouseleave="undo()" onfocus="upDate(this)" onblur="undo()">
        <img class="preview" src="images/sapa-terraces.png" alt="Sa Pa Rice Terraces, Lào Cai" tabindex="0" onmouseover="upDate(this)" onmouseleave="undo()" onfocus="upDate(this)" onblur="undo()">
        <img class="preview" src="images/cau-vang.png" alt="Golden Bridge, Bà Nà Hills, Đà Nẵng" tabindex="0" onmouseover="upDate(this)" onmouseleave="undo()" onfocus="upDate(this)" onblur="undo()">
        <img class="preview" src="images/chua1cot.png" alt="One Pillar Pagoda, Hà Nội" tabindex="0" onmouseover="upDate(this)" onmouseleave="undo()" onfocus="upDate(this)" onblur="undo()">
        <img class="preview" src="images/mekong.png" alt="Cái Răng Floating Market, Mekong Delta" tabindex="0" onmouseover="upDate(this)" onmouseleave="undo()" onfocus="upDate(this)" onblur="undo()">
    </div>
</main>
<footer>
    <p>&copy; 2026 CE210124 | Vietnam Landmarks Gallery</p>
</footer>
</body>
</html>
